<section id="tech-stack" class="tech-stack section">
  <div class="container">
    <h2 class="section-title">Tech <span>Stack</span></h2>
    <p class="section-subtitle">
      Technologies we master and leverage to build world-class products.
    </p>

    <div class="tech-stack__grid">
      @for (group of groups; track group.category; let groupIndex = $index) {
        <div
          class="tech-stack__group"
          [style.animation-delay]="(groupIndex * 0.15) + 's'"
        >
          <h3 class="tech-stack__group-title">
            <span class="tech-stack__group-dot"></span>
            {{ group.category }}
          </h3>

          <div class="tech-stack__items">
            @for (item of group.items; track item.name; let itemIndex = $index) {
              <div
                class="tech-stack__item"
                [style.--item-color]="item.color"
                [style.animation-delay]="((groupIndex * 0.15) + (itemIndex * 0.05)) + 's'"
              >
                <div class="tech-stack__item-icon">
                  <span>{{ item.letter }}</span>
                </div>
                <span class="tech-stack__item-name">{{ item.name }}</span>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
