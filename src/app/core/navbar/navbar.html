<nav class="navbar" [class.scrolled]="isScrolled()">
  <div class="navbar__container container">
    <!-- Logo -->
    <a class="navbar__logo" (click)="scrollTo('#hero')">
      <span class="navbar__logo-icon">{{ logoIcon }}</span>
      <span class="navbar__logo-text">Solv</span>
    </a>

    <!-- Desktop Navigation -->
    <ul class="navbar__links">
      @for (link of navLinks; track link.href) {
        <li>
          <a class="navbar__link" (click)="scrollTo(link.href)">{{ link.key | translate }}</a>
        </li>
      }
    </ul>

    <!-- Language Toggle -->
    <button
      class="navbar__lang-toggle"
      (click)="i18n.toggleLang()"
      [attr.aria-label]="(i18n.lang() === 'en' ? 'common.langToggleToSpanish' : 'common.langToggleToEnglish') | translate"
    >
      <span [class.active]="i18n.lang() === 'en'">EN</span>
      <span [class.active]="i18n.lang() === 'es'">ES</span>
    </button>

    <!-- CTA Button -->
    <a class="navbar__cta" (click)="scrollTo('#contact')">{{ 'nav.cta' | translate }}</a>

    <!-- Mobile Burger -->
    <button
      class="navbar__burger"
      [class.active]="isMobileMenuOpen()"
      (click)="toggleMobileMenu()"
      [attr.aria-label]="'nav.toggleMenu' | translate"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="navbar__mobile" [class.open]="isMobileMenuOpen()">
    <ul class="navbar__mobile-links">
      @for (link of navLinks; track link.href) {
        <li>
          <a class="navbar__mobile-link" (click)="scrollTo(link.href)">{{ link.key | translate }}</a>
        </li>
      }
      <li>
        <button class="navbar__mobile-lang-toggle" (click)="i18n.toggleLang()">
          <span [class.active]="i18n.lang() === 'en'">EN</span>
          <span [class.active]="i18n.lang() === 'es'">ES</span>
        </button>
      </li>
      <li>
        <a class="navbar__mobile-cta" (click)="scrollTo('#contact')">{{ 'nav.cta' | translate }}</a>
      </li>
    </ul>
  </div>
</nav>
